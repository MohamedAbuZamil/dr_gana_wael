<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Dr. Gana Wael · Dental Dream</title>
  <style>
    /* ----- RESET & BASE ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: #f9f1fd;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 0 0 40px 0;
      margin: 0;
      /* animated gradient background */
      background: linear-gradient(-45deg, #f9e7ff, #f2d9ff, #fce4f6, #faf0ff);
      background-size: 400% 400%;
      animation: gradientShift 18s ease infinite;
      overflow-x: hidden;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* main app container — mobile first */
    .app {
      max-width: 430px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 18px 30px;
      position: relative;
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 48px 48px 32px 32px;
      box-shadow: 0 20px 60px rgba(180, 130, 200, 0.20);
      border: 1px solid rgba(255, 255, 255, 0.6);
      min-height: 100vh;
      transition: all 0.2s;
      /* safe-area */
      padding-left: env(safe-area-inset-left, 18px);
      padding-right: env(safe-area-inset-right, 18px);
    }

    /* floating elements container */
    .floating-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .float-item {
      position: absolute;
      opacity: 0.25;
      font-size: 1.8rem;
      animation: floatAround 20s infinite alternate ease-in-out;
      will-change: transform;
      color: #d9b3e6;
      text-shadow: 0 0 12px rgba(255, 200, 255, 0.6);
    }

    @keyframes floatAround {
      0% { transform: translate(0, 0) scale(0.9) rotate(0deg); }
      100% { transform: translate(30px, -40px) scale(1.2) rotate(12deg); }
    }

    .float-item:nth-child(1) { top: 8%; left: 6%; animation-duration: 22s; font-size: 2.4rem; }
    .float-item:nth-child(2) { top: 18%; right: 10%; animation-duration: 26s; font-size: 1.6rem; opacity: 0.3; }
    .float-item:nth-child(3) { top: 40%; left: 3%; animation-duration: 19s; font-size: 2rem; }
    .float-item:nth-child(4) { top: 70%; right: 5%; animation-duration: 24s; font-size: 1.8rem; }
    .float-item:nth-child(5) { top: 85%; left: 12%; animation-duration: 28s; font-size: 2.6rem; opacity: 0.2; }
    .float-item:nth-child(6) { top: 55%; left: 80%; animation-duration: 21s; font-size: 1.4rem; }
    .float-item:nth-child(7) { top: 10%; left: 50%; animation-duration: 30s; font-size: 1.2rem; opacity: 0.2; }
    .float-item:nth-child(8) { bottom: 20%; left: 20%; animation-duration: 23s; font-size: 2rem; }

    /* ----- HEADER / GREETING ----- */
    .greeting-wrapper {
      margin-top: 8px;
      margin-bottom: 8px;
      position: relative;
      z-index: 2;
    }

    .greeting {
      font-size: 1.9rem;
      font-weight: 300;
      letter-spacing: -0.5px;
      color: #3d2a4a;
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      padding: 14px 20px;
      border-radius: 40px;
      display: inline-block;
      box-shadow: 0 8px 20px rgba(170, 110, 200, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.7);
      margin-bottom: 10px;
    }

    .greeting strong {
      font-weight: 700;
      color: #7d4b8c;
      background: linear-gradient(135deg, #b47bc9, #d8a0e6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .sub-motivation {
      background: rgba(255, 245, 255, 0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 32px;
      padding: 18px 20px;
      margin: 12px 0 18px;
      border: 1px solid rgba(255, 230, 255, 0.6);
      box-shadow: 0 6px 16px rgba(190, 140, 210, 0.08);
      font-size: 1.02rem;
      line-height: 1.5;
      color: #3a2945;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    /* SVG illustration */
    .dentist-svg {
      display: flex;
      justify-content: center;
      margin: 14px 0 18px;
    }
    .dentist-svg svg {
      max-width: 100px;
      height: auto;
      filter: drop-shadow(0 6px 14px rgba(190, 130, 210, 0.20));
    }

    /* ----- QUOTE RANDOM (typing) ----- */
    .quote-zone {
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      padding: 14px 18px;
      border-radius: 48px;
      margin: 10px 0 18px;
      border: 1px solid rgba(255, 215, 255, 0.6);
      text-align: center;
      font-size: 1rem;
      color: #472d55;
      font-weight: 400;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 14px rgba(150, 80, 180, 0.06);
      letter-spacing: 0.2px;
    }

    #typing-quote {
      display: inline-block;
      border-right: 2px solid #c08ed0;
      padding-right: 6px;
      animation: blink 0.8s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { border-color: #c08ed0; }
      50% { border-color: transparent; }
    }

    /* ----- CARDS (glass) ----- */
    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin: 18px 0 28px;
      position: relative;
      z-index: 2;
      scroll-behavior: smooth;
      /* snap scroll */
      scroll-snap-type: y proximity;
    }

    .card-item {
      background: rgba(255, 248, 255, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 40px;
      padding: 22px 20px 20px 22px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 12px 32px rgba(185, 120, 210, 0.10), 0 2px 6px rgba(255, 215, 255, 0.2);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 18px;
      scroll-snap-align: start;
      cursor: pointer;
      transform: scale(1);
    }

    .card-item:active {
      transform: scale(0.96);
      transition: 0.08s;
    }

    .card-icon {
      font-size: 2.4rem;
      width: 56px;
      height: 56px;
      background: rgba(255, 235, 255, 0.5);
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(210, 150, 230, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .card-content {
      flex: 1;
    }
    .card-title {
      font-weight: 700;
      font-size: 1.15rem;
      color: #462d52;
      letter-spacing: -0.2px;
      margin-bottom: 2px;
    }
    .card-message {
      font-size: 0.95rem;
      color: #4f3b5c;
      line-height: 1.4;
      font-weight: 350;
      opacity: 0.85;
    }

    /* custom scrollbar */
    .cards-container::-webkit-scrollbar {
      width: 4px;
    }
    .cards-container::-webkit-scrollbar-track {
      background: rgba(200, 160, 220, 0.15);
      border-radius: 20px;
    }
    .cards-container::-webkit-scrollbar-thumb {
      background: #d7b0e6;
      border-radius: 20px;
      box-shadow: inset 0 0 4px rgba(255, 255, 255, 0.5);
    }

    /* ----- FLOATING ACTION BUTTON (heart) ----- */
    .fab-heart {
      position: sticky;
      bottom: 20px;
      left: 100%;
      transform: translateX(-60px);
      width: 62px;
      height: 62px;
      background: linear-gradient(145deg, #f7d1ff, #ecb3fd);
      border-radius: 40px;
      border: none;
      box-shadow: 0 8px 28px rgba(190, 110, 210, 0.35);
      font-size: 2.4rem;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      cursor: pointer;
      transition: 0.2s;
      z-index: 12;
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .fab-heart:active {
      transform: scale(0.85) translateX(-60px);
      box-shadow: 0 4px 16px rgba(190, 80, 200, 0.3);
    }

    /* ----- FOOTER ----- */
    .footer-love {
      margin: 30px 0 8px;
      text-align: center;
      font-size: 1rem;
      color: #5a4568;
      background: rgba(255, 245, 255, 0.3);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      padding: 18px 10px;
      border-radius: 56px;
      border: 1px solid rgba(255, 220, 255, 0.5);
      letter-spacing: 0.3px;
      font-weight: 350;
    }

    .footer-love strong {
      font-weight: 700;
      background: linear-gradient(135deg, #b77fd0, #d6a4e8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* heart explosion & confetti (canvas) */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    /* ----- RESPONSIVE fine-tune ----- */
    @media (max-width: 430px) {
      .app { padding: 16px 14px 25px; }
      .greeting { font-size: 1.7rem; padding: 12px 16px; }
    }
  </style>
</head>
<body>

  <!-- floating background elements (hearts, stars, sparkles, flowers) -->
  <div class="floating-bg" aria-hidden="true">
    <span class="float-item">❤️</span>
    <span class="float-item">✦</span>
    <span class="float-item">🌸</span>
    <span class="float-item">✨</span>
    <span class="float-item">💖</span>
    <span class="float-item">🌷</span>
    <span class="float-item">⭐</span>
    <span class="float-item">🦷</span>
  </div>

  <!-- main app -->
  <div class="app" id="app">
    <!-- header greeting -->
    <div class="greeting-wrapper">
      <div class="greeting">
        Welcome<br><strong>Dr. Gana Wael</strong>
      </div>
    </div>

    <!-- motivational paragraph -->
    <div class="sub-motivation">
      Every page you study today is another step toward your dream of becoming an amazing dentist. <br> Believe in yourself because your future is already smiling at you.
    </div>

    <!-- dentist SVG cute -->
    <div class="dentist-svg">
      <svg width="120" height="100" viewBox="0 0 120 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="60" cy="40" r="28" fill="#FAD6FF" stroke="#D9A6E6" stroke-width="2.5" />
        <circle cx="49" cy="35" r="4" fill="#4A2D4F" />
        <circle cx="71" cy="35" r="4" fill="#4A2D4F" />
        <path d="M52 50 Q60 58 68 50" stroke="#B37FCA" stroke-width="3.5" stroke-linecap="round" />
        <rect x="52" y="60" width="16" height="20" rx="8" fill="#FCE8FF" stroke="#D9A6E6" stroke-width="2" />
        <rect x="56" y="64" width="8" height="12" rx="4" fill="#FEF8FF" stroke="#C99DD6" stroke-width="1.5" />
        <circle cx="58" cy="68" r="1.5" fill="#D9A6E6" />
        <circle cx="64" cy="68" r="1.5" fill="#D9A6E6" />
        <path d="M28 68 L36 62 L40 68 L32 72 L28 68Z" fill="#FCE8FF" stroke="#D9A6E6" stroke-width="1.8" />
        <path d="M92 68 L84 62 L80 68 L88 72 L92 68Z" fill="#FCE8FF" stroke="#D9A6E6" stroke-width="1.8" />
      </svg>
    </div>

    <!-- random quote with typing -->
    <div class="quote-zone">
      <span id="typing-quote"></span>
    </div>

    <!-- CARDS container (50 motivational cards) -->
    <div class="cards-container" id="cardsContainer">
      <!-- cards injected by JS -->
    </div>

    <!-- floating action heart button -->
    <div class="fab-heart" id="fabHeart">❤️</div>

    <!-- footer -->
    <div class="footer-love">
      Made with love 🤍<br>
      Especially for <strong>Dr. Gana Wael</strong><br>
      <span style="font-size:0.9rem; opacity:0.8;">Future Dentist</span>
    </div>
  </div>

  <!-- confetti canvas overlay -->
  <canvas id="confetti-canvas"></canvas>

  <script>
    (function() {
      "use strict";

      // ---------- 50 UNIQUE MOTIVATIONAL MESSAGES ----------
      const messagesList = [
        { icon: "🦷", title: "Stronger than doubt", msg: "You are stronger than your doubts." },
        { icon: "🪥", title: "Future dentist", msg: "The future dentist inside you is getting closer every single day." },
        { icon: "✨", title: "Shine bright", msg: "Your smile can light up an entire room." },
        { icon: "🌟", title: "Beautiful things", msg: "You were born to achieve beautiful things." },
        { icon: "📖", title: "One page closer", msg: "Every chapter you finish is another step toward your white coat." },
        { icon: "💪", title: "Believe", msg: "Believe in yourself because you are capable of amazing things." },
        { icon: "👩‍⚕️", title: "Keep going", msg: "Keep going. Your future patients are waiting for their favorite dentist." },
        { icon: "⏳", title: "Hard work", msg: "Hard work today creates beautiful memories tomorrow." },
        { icon: "💖", title: "Success looks good", msg: "Success looks beautiful on you." },
        { icon: "🧠", title: "Brilliant mind", msg: "You have a beautiful heart and a brilliant mind." },
        { icon: "👑", title: "Dream woman", msg: "You are becoming the woman you've always dreamed of." },
        { icon: "☀️", title: "Keep shining", msg: "Your dedication will turn your dream into a beautiful reality." },
        { icon: "📚", title: "Study power", msg: "Every hour you study is a seed for your future practice." },
        { icon: "💎", title: "Precious", msg: "Your ambition is as precious as a diamond." },
        { icon: "🌈", title: "After rain", msg: "After every difficult subject, there's a rainbow of understanding." },
        { icon: "🔥", title: "Inner fire", msg: "Your passion for dentistry will light up the world." },
        { icon: "🌸", title: "Blooming", msg: "You are blooming into an extraordinary dentist." },
        { icon: "🏆", title: "Champion", msg: "You are a champion in the making." },
        { icon: "🌺", title: "Grace", msg: "You carry grace and determination in equal measure." },
        { icon: "🕊️", title: "Peace", msg: "Find peace in your progress; every step counts." },
        { icon: "⭐", title: "Star", msg: "You are a star, and your light will guide many." },
        { icon: "🎯", title: "Focused", msg: "Stay focused; your goal is closer than you think." },
        { icon: "💫", title: "Magic", msg: "There's magic in your persistence." },
        { icon: "🌿", title: "Growth", msg: "Growth is uncomfortable, but you are thriving." },
        { icon: "🍀", title: "Lucky", msg: "You make your own luck with hard work." },
        { icon: "🧘", title: "Calm", msg: "Stay calm and keep studying; you've got this." },
        { icon: "💗", title: "Heart", msg: "Your big heart will heal many smiles." },
        { icon: "⚡", title: "Energy", msg: "Your energy is contagious—use it wisely." },
        { icon: "🌙", title: "Dreamer", msg: "Dream big, because you are capable of achieving it." },
        { icon: "🦋", title: "Transformation", msg: "You are transforming into a confident dentist every day." },
        { icon: "🌞", title: "Sunshine", msg: "Your future is bright like the morning sun." },
        { icon: "📈", title: "Progress", msg: "Progress, not perfection, is your superpower." },
        { icon: "🎓", title: "Graduation", msg: "Every test you pass is a step toward your white coat." },
        { icon: "🧪", title: "Science", msg: "You master the science of smiles." },
        { icon: "🔬", title: "Curious", msg: "Your curiosity will make you an exceptional dentist." },
        { icon: "💉", title: "Care", msg: "You care deeply, and that will set you apart." },
        { icon: "❤️‍🩹", title: "Healer", msg: "You are a healer in the making." },
        { icon: "🧁", title: "Sweet", msg: "Your kindness is as sweet as your future success." },
        { icon: "🎈", title: "Celebrate", msg: "Celebrate every small victory on your journey." },
        { icon: "🎶", title: "Rhythm", msg: "Find your rhythm in studying; it gets easier." },
        { icon: "🧩", title: "Puzzle", msg: "You are piecing together a beautiful career." },
        { icon: "🎀", title: "Gift", msg: "You are a gift to the world of dentistry." },
        { icon: "🩺", title: "Stethoscope", msg: "One day you'll wear that stethoscope with pride." },
        { icon: "📋", title: "Plan", msg: "Your plan is solid; keep executing." },
        { icon: "💡", title: "Bright idea", msg: "Bright ideas flow from your brilliant mind." },
        { icon: "🥇", title: "Gold", msg: "You deserve all the gold that comes your way." },
        { icon: "🔮", title: "Future", msg: "Your future is full of beautiful smiles." },
        { icon: "🌊", title: "Wave", msg: "Ride the waves of challenges with courage." },
        { icon: "🪞", title: "Reflection", msg: "Look in the mirror: a future dentist is looking back." },
        { icon: "💐", title: "Blossom", msg: "You blossom with every page you read." }
      ];

      // shuffle and pick 50 (they are already 50)
      const cardsData = messagesList.slice(0, 50);

      // ----- render cards -----
      const container = document.getElementById('cardsContainer');
      cardsData.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'card-item';
        card.dataset.index = idx;
        card.innerHTML = `
          <div class="card-icon">${item.icon}</div>
          <div class="card-content">
            <div class="card-title">${item.title}</div>
            <div class="card-message">${item.msg}</div>
          </div>
        `;
        container.appendChild(card);
      });

      // ----- confetti & explosion effect (canvas) -----
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      let w, h;
      function resizeCanvas() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      let particles = [];
      const colors = ['#ffb3d9', '#ff8ac4', '#f7b0f0', '#ffd1dc', '#e6b3f0', '#f7c6ff', '#ff99cc', '#d9b3ff'];

      function createExplosion(cx, cy) {
        const count = 60;
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * 2 * Math.PI;
          const speed = 3 + Math.random() * 10;
          const size = 6 + Math.random() * 14;
          particles.push({
            x: cx,
            y: cy,
            vx: Math.cos(angle) * speed * (0.6 + Math.random() * 0.8),
            vy: Math.sin(angle) * speed * (0.6 + Math.random() * 0.8) - 2,
            size: size,
            color: colors[Math.floor(Math.random() * colors.length)],
            life: 1.0,
            decay: 0.012 + Math.random() * 0.02,
            gravity: 0.12,
            shape: Math.random() > 0.5 ? 'heart' : 'star'
          });
        }
        // extra sparkles
        for (let i = 0; i < 30; i++) {
          const angle = Math.random() * 2 * Math.PI;
          const speed = 1 + Math.random() * 5;
          particles.push({
            x: cx,
            y: cy,
            vx: Math.cos(angle) * speed * 0.7,
            vy: Math.sin(angle) * speed * 0.7 - 3,
            size: 3 + Math.random() * 8,
            color: '#fff9c4',
            life: 1.0,
            decay: 0.015 + Math.random() * 0.025,
            gravity: 0.05,
            shape: 'sparkle'
          });
        }
      }

      function drawParticles() {
        ctx.clearRect(0, 0, w, h);
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.life -= p.decay;
          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }
          ctx.globalAlpha = p.life * 0.9;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.fillStyle = p.color;
          if (p.shape === 'heart') {
            ctx.font = `${p.size * 1.2}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('❤️', 0, 0);
          } else if (p.shape === 'star') {
            ctx.font = `${p.size * 1.2}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('✦', 0, 0);
          } else {
            ctx.beginPath();
            ctx.arc(0, 0, p.size * 0.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowColor = '#fce4ff';
            ctx.shadowBlur = 10;
          }
          ctx.restore();
        }
        if (particles.length > 0) {
          requestAnimationFrame(drawParticles);
        } else {
          ctx.clearRect(0, 0, w, h);
        }
      }

      // card click: bounce + explosion + sparkles/confetti
      document.querySelectorAll('.card-item').forEach(card => {
        card.addEventListener('click', function(e) {
          // bounce animation (via class)
          this.style.transition = 'transform 0.12s cubic-bezier(0.2, 0.9, 0.4, 1)';
          this.style.transform = 'scale(0.90)';
          setTimeout(() => {
            this.style.transform = 'scale(1)';
          }, 120);

          // explosion at click position
          const rect = this.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          createExplosion(cx, cy);
          if (particles.length > 0) {
            drawParticles();
          }

          // also pop heart from fab (extra joy)
          const fab = document.getElementById('fabHeart');
          fab.style.transition = 'transform 0.1s';
          fab.style.transform = 'scale(1.3)';
          setTimeout(() => { fab.style.transform = 'scale(1)'; }, 120);
        });
      });

      // fab heart click -> explosion
      document.getElementById('fabHeart').addEventListener('click', function(e) {
        const rect = this.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        createExplosion(cx, cy);
        drawParticles();
        this.style.transform = 'scale(0.8)';
        setTimeout(() => { this.style.transform = 'scale(1)'; }, 150);
      });

      // ----- RANDOM QUOTE + TYPING -----
      const quoteEl = document.getElementById('typing-quote');
      const quotes = [
        "✨ Believe in your smile!",
        "🦷 Your dream is becoming real.",
        "💖 Keep going, superstar!",
        "🌟 You are a future healer.",
        "🌸 Every day you grow stronger.",
        "🌙 The world needs your smile.",
        "⚡ You are unstoppable.",
        "💎 Shine like the dentist you are.",
        "🌺 Kindness + skills = amazing dentist.",
        "🧠 You are brilliant and brave."
      ];

      function typeQuote() {
        const randomIdx = Math.floor(Math.random() * quotes.length);
        const text = quotes[randomIdx];
        let idx = 0;
        quoteEl.textContent = '';
        quoteEl.style.borderRight = '2px solid #c08ed0';
        function typeChar() {
          if (idx < text.length) {
            quoteEl.textContent += text.charAt(idx);
            idx++;
            setTimeout(typeChar, 40 + Math.random() * 40);
          } else {
            quoteEl.style.borderRight = 'none';
            // reset after 6s
            setTimeout(() => {
              quoteEl.style.borderRight = '2px solid #c08ed0';
              typeQuote();
            }, 6000);
          }
        }
        typeChar();
      }
      typeQuote();

      // also random quote on load (already)

      // ----- snap scroll smooth + parallax (extra) -----
      // just passive; we already have snap scroll in css

      // small parallax on scroll (background float shift)
      window.addEventListener('scroll', function() {
        const scrollY = window.scrollY;
        const floats = document.querySelectorAll('.float-item');
        floats.forEach((el, i) => {
          const speed = 0.1 + (i * 0.02);
          el.style.transform = `translateY(${scrollY * speed * 0.2}px)`;
        });
      });

      // adjust safe area padding
      if (window.navigator.userAgent.includes('iPhone')) {
        document.querySelector('.app').style.paddingLeft = 'env(safe-area-inset-left, 18px)';
        document.querySelector('.app').style.paddingRight = 'env(safe-area-inset-right, 18px)';
      }

    })();
  </script>
</body>
</html>
